name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The suite runs ~14 min locally and is mostly PSO; hosted runners have
    # fewer cores, so leave headroom.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-clang
            os: ubuntu-latest
          - name: windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # clang needs LLVM's OpenMP runtime for the optimizer's parallel loops
      - name: Install OpenMP runtime (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Build C++ engine (clang)
        if: runner.os == 'Linux'
        env:
          CC: clang
          CXX: clang++
        run: python setup.py build_ext --inplace

      - name: Build C++ engine (MSVC)
        if: runner.os == 'Windows'
        run: python setup.py build_ext --inplace

      - name: Run tests
        # test_supertrend_calculation is a known pre-existing failure (see CLAUDE.md);
        # the cpp-optimizer test passes here because the extension is built above.
        run: >
          python -m pytest tests/ -q
          --deselect tests/test_indicators.py::TestIndicators::test_supertrend_calculation
